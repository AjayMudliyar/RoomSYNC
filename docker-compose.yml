services:
  db:
    image: postgres:16.8-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - roomsync_postgres_data:/var/lib/postgresql/data
    networks:
      - roomsync_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4.2-alpine3.21
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - roomsync_redis_data:/data
    networks:
      - roomsync_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - roomsync_minio_data:/data
    networks:
      - roomsync_internal
    healthcheck:
      test: ["CMD", "/usr/bin/curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: pgsty/mc:RELEASE.2026-11-09T00-00-00Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
    volumes:
      - ./infrastructure/docker/minio-init.sh:/init/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    networks:
      - roomsync_internal

  matching:
    build:
      context: ./services/matching
      dockerfile: ../../infrastructure/docker/matching.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8001"
    volumes:
      - ./services/matching:/app:ro
    networks:
      - roomsync_internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  backend:
    build:
      context: ./services/backend
      dockerfile: ../../infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./services/backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      matching:
        condition: service_healthy
    networks:
      - roomsync_internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  worker:
    build:
      context: ./services/backend
      dockerfile: ../../infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    volumes:
      - ./services/backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - roomsync_internal
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4:9.19
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - roomsync_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    networks:
      - roomsync_internal

volumes:
  roomsync_postgres_data:
  roomsync_redis_data:
  roomsync_minio_data:
  roomsync_pgadmin_data:

networks:
  roomsync_internal:
    driver: bridge

