openapi: 3.0.3
info:
  title: RoomSync Public API
  version: 0.1.0
  description: Authoritative compatibility-first roommate discovery API.
paths:
  /api/v1/auth/csrf:
    get:
      operationId: auth_csrf_retrieve
      description: Issue a CSRF cookie and token for Web SPA unsafe requests.
      tags:
      - Auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenEnvelope'
          description: ''
  /api/v1/auth/email/resend:
    post:
      operationId: auth_email_resend_create
      description: Queue verification email resend without disclosing account existence.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailResendRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailResendRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailResendRequestRequest'
      security:
      - bearerAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcceptedEnvelope'
          description: ''
  /api/v1/auth/email/verify:
    post:
      operationId: auth_email_verify_create
      description: Consume single-use email verification token and stamp email_verified_at.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerifyEnvelope'
          description: ''
  /api/v1/auth/google:
    post:
      operationId: auth_google_create
      description: Verify Google ID token and sign in or create unmerged confirmation
        challenge.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
          description: ''
  /api/v1/auth/google/link:
    post:
      operationId: auth_google_link_create
      description: Explicitly confirm and prove account ownership before linking a
        Google identity.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLinkRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLinkRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLinkRequestRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
          description: ''
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: Authenticate an existing email/password account.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Revoke active session family and clear cookies for Web clients.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'
          description: ''
  /api/v1/auth/password/change:
    post:
      operationId: auth_password_change_create
      description: Change authenticated password and revoke all sibling session families.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChangeEnvelope'
          description: ''
  /api/v1/auth/password/forgot:
    post:
      operationId: auth_password_forgot_create
      description: Issue password reset token asynchronously without revealing account
        existence.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequestRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericAcceptedEnvelope'
          description: ''
  /api/v1/auth/password/reset:
    post:
      operationId: auth_password_reset_create
      description: Consume single-use password reset token and invalidate all active
        sessions.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetEnvelope'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: Rotate refresh token atomically and detect refresh reuse across
        web cookies or mobile.
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: auth_register_create
      description: Register an email/password account (status='active', email_verified_at=None).
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequestRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionEnvelope'
          description: ''
  /api/v1/me:
    get:
      operationId: me_retrieve
      description: Read or update authenticated user's capability settings (server-enforced).
      tags:
      - Account
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
          description: ''
    patch:
      operationId: me_partial_update
      description: Read or update authenticated user's capability settings (server-enforced).
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequestRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
          description: ''
  /api/v1/me/data-export:
    get:
      operationId: me_data_export_retrieve
      description: Export current user's non-secret account, identity, session, and
        security records.
      tags:
      - Account
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportEnvelope'
          description: ''
  /api/v1/me/deletion-request:
    post:
      operationId: me_deletion_request_create
      description: Request DPDP account deletion requiring explicit phrase confirmation
        and reauth.
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeletionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeletionRequestRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletionRequestEnvelope'
          description: ''
  /api/v1/me/sessions:
    get:
      operationId: me_sessions_list
      description: List current user's active session families.
      tags:
      - Account
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionListEnvelope'
          description: ''
  /api/v1/me/sessions/{session_id}:
    delete:
      operationId: me_sessions_destroy
      description: Revoke one active session family owned strictly by the authenticated
        user.
      parameters:
      - in: path
        name: session_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Account
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/system/status:
    get:
      operationId: system_status_retrieve
      description: Minimal M0 public system status endpoint verifying DRF envelopes
        and OpenAPI generation.
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatusEnvelope'
          description: ''
components:
  schemas:
    AuthSessionData:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        platform:
          $ref: '#/components/schemas/ClientPlatformEnum'
        session_id:
          type: string
          format: uuid
        expires_in_seconds:
          type: integer
        tokens:
          allOf:
          - $ref: '#/components/schemas/AuthTokens'
          nullable: true
      required:
      - expires_in_seconds
      - platform
      - session_id
      - user
    AuthSessionEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthSessionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - data
      - meta
    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in_seconds:
          type: integer
      required:
      - access_token
      - expires_in_seconds
      - refresh_token
      - token_type
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        phone_e164:
          type: string
          nullable: true
        status:
          type: string
        email_verified:
          type: boolean
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        phone_verified_at:
          type: string
          format: date-time
          nullable: true
        terms_accepted_at:
          type: string
          format: date-time
          nullable: true
        deletion_requested_at:
          type: string
          format: date-time
          nullable: true
        has_usable_password:
          type: boolean
        linked_providers:
          type: array
          items:
            type: string
        capabilities:
          $ref: '#/components/schemas/UserCapabilities'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - capabilities
      - created_at
      - deletion_requested_at
      - email
      - email_verified
      - email_verified_at
      - has_usable_password
      - id
      - linked_providers
      - phone_e164
      - phone_verified_at
      - status
      - terms_accepted_at
      - updated_at
    AuthUserEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/AuthUser'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - data
      - meta
    ClientPlatformEnum:
      enum:
      - web
      - android
      type: string
      description: |-
        * `web` - Web
        * `android` - Android
    CsrfTokenData:
      type: object
      properties:
        csrf_token:
          type: string
      required:
      - csrf_token
    CsrfTokenEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CsrfTokenData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - data
      - meta
    DataExportData:
      type: object
      properties:
        schema_version:
          type: string
        exported_at:
          type: string
          format: date-time
        account:
          $ref: '#/components/schemas/ExportAccount'
        oauth_identities:
          type: array
          items:
            $ref: '#/components/schemas/ExportOAuthIdentity'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ExportSession'
        security_events:
          type: array
          items:
            $ref: '#/components/schemas/ExportSecurityEvent'
      required:
      - account
      - exported_at
      - oauth_identities
      - schema_version
      - security_events
      - sessions
    DataExportEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DataExportData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - data
      - meta
    DeletionRequestEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/DeletionRequestResponseData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - data
      - meta
    DeletionRequestRequest:
      type: object
      description: Base input serializer rejecting unknown fields with 400 VALIDATION_ERROR.
      properties:
        confirmation_text:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
        google_id_token:
          type: string
          minLength: 1
          maxLength: 4096
        nonce:
          type: string
          minLength: 1
          maxLength: 256
        confirm_recent_reauth:
          type: boolean
          default: false
      required:
      - confirmation_text
    DeletionRequestResponseData:
      type: object
      properties:
        deletion_requested:
          type: boolean
        deletion_requested_at:
          type: string
          format: date-time
      required:
      - deletion_requested
      - deletion_requested_at
    EmailResendRequestRequest:
      type: object
      description: Base input serializer rejecting unknown fields with 400 VALIDATION_ERROR.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
    EmailVerifyEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/EmailVerifyResponseData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - data
      - meta
    EmailVerifyRequestRequest:
      type: object
      description: Base input serializer rejecting unknown fields with 400 VALIDATION_ERROR.
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 512
      required:
      - token
    EmailVerifyResponseData:
      type: object
      properties:
        verified:
          type: boolean
        email_verified_at:
          type: string
          format: date-time
      required:
      - email_verified_at
      - verified
    ExportAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        phone_e164:
          type: string
          nullable: true
        status:
          type: string
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        phone_verified_at:
          type: string
          format: date-time
          nullable: true
        terms_accepted_at:
          type: string
          format: date-time
          nullable: true
        password_changed_at:
          type: string
          format: date-time
          nullable: true
        deletion_requested_at:
          type: string
          format: date-time
          nullable: true
        capabilities:
          $ref: '#/components/schemas/UserCapabilities'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - capabilities
      - created_at
      - deletion_requested_at
      - email
      - email_verified_at
      - id
      - password_changed_at
      - phone_e164
      - phone_verified_at
      - status
      - terms_accepted_at
      - updated_at
    ExportOAuthIdentity:
      type: object
      properties:
        provider:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - last_used_at
      - provider
    ExportSecurityEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        event_type:
          type: string
        outcome:
          type: string
        client_platform:
          type: string
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - client_platform
      - created_at
      - event_type
      - id
      - outcome
      - request_id
    ExportSession:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_platform:
          type: string
        device_label:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
      required:
      - client_platform
      - created_at
      - device_label
      - expires_at
      - id
      - last_used_at
      - revoked_at
    GenericAcceptedData:
      type: object
      properties:
        accepted:
          type: boolean
        message:
          type: string
      required:
      - accepted
      - message
    GenericAcceptedEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/GenericAcceptedData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - data
      - meta
    GoogleAuthRequestRequest:
      type: object
      description: Base input serializer rejecting unknown fields with 400 VALIDATION_ERROR.
      properties:
        id_token:
          type: string
          minLength: 16
          maxLength: 4096
        nonce:
          type: string
          minLength: 16
          maxLength: 256
        accept_terms:
          type: boolean
        confirm_adult:
          type: boolean
        device_label:
          type: string
          maxLength: 120
      required:
      - id_token
      - nonce
    GoogleLinkRequestRequest:
      type: object
      description: Base input serializer rejecting unknown fields with 400 VALIDATION_ERROR.
      properties:
        link_challenge_token:
          type: string
          minLength: 16
          maxLength: 512
        confirm_link:
          type: boolean
        password:
          type: string
          minLength: 1
          maxLength: 256
        email_verification_token:
          type: string
          minLength: 1
          maxLength: 512
        device_label:
          type: string
          maxLength: 120
      required:
      - confirm_link
      - link_challenge_token
    LoginRequestRequest:
      type: object
      description: Base input serializer rejecting unknown fields with 400 VALIDATION_ERROR.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
        device_label:
          type: string
          maxLength: 120
      required:
      - email
      - password
    LogoutEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/LogoutResponseData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - data
      - meta
    LogoutRequestRequest:
      type: object
      description: Base input serializer rejecting unknown fields with 400 VALIDATION_ERROR.
      properties:
        refresh_token:
          type: string
          minLength: 16
          maxLength: 512
    LogoutResponseData:
      type: object
      properties:
        logged_out:
          type: boolean
      required:
      - logged_out
    PasswordChangeEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PasswordChangeResponseData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - data
      - meta
    PasswordChangeRequestRequest:
      type: object
      description: Base input serializer rejecting unknown fields with 400 VALIDATION_ERROR.
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 256
        new_password:
          type: string
          minLength: 10
          maxLength: 256
      required:
      - new_password
    PasswordChangeResponseData:
      type: object
      properties:
        password_changed:
          type: boolean
      required:
      - password_changed
    PasswordForgotRequestRequest:
      type: object
      description: Base input serializer rejecting unknown fields with 400 VALIDATION_ERROR.
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    PasswordResetEnvelope:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PasswordResetResponseData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      required:
      - data
      - meta
    PasswordResetRequestRequest:
      type: object
      description: Base input serializer rejecting unknown fields with 400 VALIDATION_ERROR.
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 512
        new_password:
          type: string
          minLength: 10
          maxLength: 256
      required:
      - new_password
      - token
    PasswordResetResponseData:
      type: object
      properties:
        password_reset:
          type: boolean
      required:
      - password_reset
    PatchedMeUpdateRequestRequest:
      type: object
      description: Base input serializer rejecting unknown fields with 400 VALIDATION_ERROR.
      properties:
