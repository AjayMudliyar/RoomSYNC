[project]
name = "roomsync-backend"
version = "0.1.0"
description = "Authoritative Django + DRF backend for RoomSync"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.5.2,<6.0",
    "django>=5.2,<5.3",
    "django-cors-headers>=4.7.0,<5.0",
    "djangorestframework>=3.16.0,<4.0",
    "drf-spectacular>=0.28.0,<0.29",
    "psycopg[binary]>=3.2.6,<4.0",
    "redis>=5.2.1,<6.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.1.3,<6.0",
    "djangorestframework-stubs[compatible-mypy]>=3.15.3,<4.0",
    "mypy>=1.15.0,<2.0",
    "pytest>=8.3.5,<9.0",
    "pytest-django>=4.11.1,<5.0",
    "ruff>=0.11.6,<0.12",
    "types-redis>=4.6.0.20241004",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["apps/*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["apps/.*/migrations/.*"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["common.tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
