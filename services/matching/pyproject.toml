[project]
name = "roomsync-matching"
version = "0.1.0"
description = "Private stateless FastAPI compatibility computation service for RoomSync"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.12,<0.116",
    "pydantic>=2.10.6,<3.0",
    "pydantic-settings>=2.8.1,<3.0",
    "uvicorn>=0.34.0,<0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "mypy>=1.15.0,<2.0",
    "pytest>=8.3.5,<9.0",
    "ruff>=0.11.6,<0.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

